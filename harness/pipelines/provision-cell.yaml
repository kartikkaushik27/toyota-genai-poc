pipeline:
  name: Provision Cell
  identifier: provision_cell
  projectIdentifier: toyota_genai_full
  orgIdentifier: default
  description: |
    Provisions one GenAI Platform cell from opentofu/cells/<cell>.

    One workspace per cell: the stage's workspace is resolved from the
    cell_name input, so cell_name=cell1 targets the "cell1" IaCM workspace
    (and its own state). Onboard a new cell with
    harness/scripts/create-cell-workspace.py before running this for it.

    project_prefix is intentionally NOT an input — there is a single
    platform-wide prefix defined in opentofu/modules/naming.
  tags: {}
  variables:
  - name: cell_name
    type: String
    description: Cell to provision. Must match both the opentofu/cells/<cell_name> directory and the IaCM workspace identifier.
    required: true
    value: <+input>.default(cell1)
  - name: aws_region
    type: String
    description: AWS region the cell is deployed in
    required: true
    value: <+input>.default(us-east-1)
  - name: aws_connector
    type: String
    description: Harness AWS connector for this cell's account. Harness pins the provider connector on the workspace itself, so this must match the connector configured on the target cell workspace.
    required: true
    value: <+input>.default(aws_full)
  stages:
  - stage:
      name: Provision Cell
      identifier: provision_cell
      type: IACM
      spec:
        workspace: <+pipeline.variables.cell_name>
        platform:
          os: Linux
          arch: Amd64
        runtime:
          type: Cloud
          spec: {}
        execution:
          steps:
          - step:
              type: IACMTerraformPlugin
              name: OpenTofu Init
              identifier: tofu_init
              spec:
                command: init
          - step:
              type: IACMTerraformPlugin
              name: OpenTofu Plan
              identifier: tofu_plan
              spec:
                command: plan
          - step:
              type: HarnessApproval
              name: Review Cell Plan
              identifier: review_cell_plan
              timeout: 1d
              spec:
                approvalMessage: |
                  Review the OpenTofu plan for cell <+pipeline.variables.cell_name>
                  in region <+pipeline.variables.aws_region> (connector
                  <+pipeline.variables.aws_connector>) before it is applied.
                includePipelineExecutionHistory: true
                isAutoRejectEnabled: false
                approvers:
                  userGroups:
                  - _project_all_users
                  minimumCount: 1
                  disallowPipelineExecutor: false
                approverInputs: []
          - step:
              type: IACMTerraformPlugin
              name: OpenTofu Apply
              identifier: tofu_apply
              spec:
                command: apply
      tags: {}
